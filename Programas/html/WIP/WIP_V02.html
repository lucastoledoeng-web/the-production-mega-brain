const $=id=>document.getElementById(id),FASES=CONFIG.fases.map((f,i)=>({n:f[0],side:f[1],g:i,res:f[2]})),EXP=FASES.length,REC=new Map(),ord={AT:0,MT:0};

for(const s in CONFIG.saida)CONFIG.saida[s].forEach(r=>REC.set(r,{g:EXP,rk:1e6,side:s}));
const dn=g=>FASES[g].n.replace(/\s*MT$/,''),NM=g=>g<0?'—':g==EXP?'Expedição':dn(g),pct=v=>v==null?'—':(v*100).toFixed(1).replace('.',',')+'%',nf=v=>v.toLocaleString('pt-BR');
let S=null;

const dT=id=>{const v=$(id).value;if(!v)return null;const a=v.split('-');return Date.UTC(+a[0],+a[1]-1,+a[2],6,0)/6e4};
async function ler(file,fn){const rd=file.stream().getReader();let dec=null,buf='',n=0;
 for(;;){const {done,value}=await rd.read();if(done)break;n+=value.length;
  if(!dec){let e='utf-8';try{new TextDecoder('utf-8',{fatal:true}).decode(value,{stream:true})}catch(_){e='windows-1252'}dec=new TextDecoder(e)}
  buf+=dec.decode(value,{stream:true});const i=buf.lastIndexOf('\n');if(i<0)continue;

  const stt=p1==EXP?'Expedida':nw&&ok(p1)?'Moveu ('+nw+')':nw&&p0>=0?'Saiu':nw?'Passou':ok(p0)&&p0==p1?'Ficou':'';

  bl=F.filter(g=>!CONFIG.totalBalancoExclui.includes(FASES[g].n)&&bal(g)!=null).map(bal),bt=bl.length?bl.reduce((a,b)=>a+b)/bl.length:null,wiT=sum(R.wi),wfT=sum(R.wf);
